version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:password@db:5432/crmtsiapp
      - REDIS_HOST=redis
    depends_on:
      - db
      - redis
    volumes:
      - ./:/app
      - ./logs:/app/logs

  db:
    image: postgres:14
    environment:
      - POSTGRES_DB=crmtsiapp
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  db_data:
  redis_data:
